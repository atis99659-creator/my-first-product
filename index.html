`<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Trip Guide Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
    <div class="bg-blobs">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
    </div>
    <div class="noise-overlay"></div>

    <header>
        <h1 id="pageTitle">🌏 Culture Guide</h1>
        <div class="search-container">
            <input type="text" id="countrySearch" placeholder="Search country..." aria-label="Search Country">
            <div id="countryDropdown" class="country-dropdown" style="display: none;"></div>
        </div>
        <div class="controls">
            <button id="langToggle" class="lang-toggle" aria-label="Switch Language">
                English
            </button>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                Switch Theme
            </button>
        </div>
    </header>

    <div id="navBar" style="display: none;">
        <!-- Hidden but kept for backward compatibility if needed -->
    </div>

    <main id="content">
        <!-- Content will be injected here by ui.js -->
    </main>

    <footer>
        <p id="footerText">&copy; 2026 World Culture Guide. All rights reserved.</p>
    </footer>

    <!-- Regions Modal -->
    <div id="regionModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="modalTitle">Detailed Regions</h2>
            <div id="regionsContainer" class="regions-grid">
                <!-- Region buttons will be injected here -->
            </div>
            <div id="regionDetail" class="region-detail-box">
                <p id="regionHint">Select a region to learn more</p>
                <div id="selectedRegionContent" class="selected-region-content" style="display: none;">
                    <h3 id="selectedRegionTitle"></h3>
                    <div class="theme-buttons-container">
                        <button class="theme-btn" data-theme="restaurant" id="btnThemeRestaurant">🍴 음식점</button>
                        <button class="theme-btn" data-theme="cafe" id="btnThemeCafe">☕ 카페</button>
                        <button class="theme-btn" data-theme="landmark" id="btnThemeLandmark">🏰 명소</button>
                        <button class="theme-btn" data-theme="activity" id="btnThemeActivity">⛷️ 액티비티</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    </body>
    </html>
