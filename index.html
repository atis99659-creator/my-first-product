<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East Asian Culture Guide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="pageTitle">🌏 Culture Guide</h1>
        <div class="controls">
            <button id="langToggle" class="lang-toggle" aria-label="Switch Language">
                English
            </button>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                Switch Theme
            </button>
        </div>
    </header>

    <nav id="navBar">
        <button class="nav-btn" data-country="korea" id="btnKorea">🇰🇷 Korea</button>
        <button class="nav-btn" data-country="china" id="btnChina">🇨🇳 China</button>
        <button class="nav-btn" data-country="japan" id="btnJapan">🇯🇵 Japan</button>
        <button class="nav-btn" data-country="france" id="btnFrance">🇫🇷 France</button>
        <button class="nav-btn" data-country="spain" id="btnSpain">🇪🇸 Spain</button>
        <button class="nav-btn" data-country="usa" id="btnUSA">🇺🇸 USA</button>
        <button class="nav-btn" data-country="turkey" id="btnTurkey">🇹🇷 Turkey</button>
        <button class="nav-btn" data-country="italy" id="btnItaly">🇮🇹 Italy</button>
        <button class="nav-btn" data-country="mexico" id="btnMexico">🇲🇽 Mexico</button>
        <button class="nav-btn" data-country="uk" id="btnUK">🇬🇧 UK</button>
        <button class="nav-btn" data-country="germany" id="btnGermany">🇩🇪 Germany</button>
        <button class="nav-btn" data-country="greece" id="btnGreece">🇬🇷 Greece</button>
    </nav>

    <main id="content">
        <!-- Content will be injected here by main.js -->
    </main>

    <footer>
        <p id="footerText">&copy; 2026 World Culture Guide. All rights reserved.</p>
    </footer>

    <!-- Map Modal -->
    <div id="mapModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 id="mapTitle">Interactive Map</h2>
            <div id="mapContainer">
                <!-- SVG will be injected here -->
            </div>
            <div id="regionInfo">
                <p id="regionHint">Click on a region to see its name</p>
                <h3 id="selectedRegionName"></h3>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
    </body>
    </html>
