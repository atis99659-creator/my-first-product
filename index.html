<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>East Asian Culture Guide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="pageTitle">🌏 Culture Guide</h1>
        <div class="controls">
            <button id="langToggle" class="lang-toggle" aria-label="Switch Language">
                English
            </button>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">
                Switch Theme
            </button>
        </div>
    </header>

    <nav id="navBar">
        <button class="nav-btn active" data-country="korea" id="btnKorea">🇰🇷 Korea</button>
        <button class="nav-btn" data-country="china" id="btnChina">🇨🇳 China</button>
        <button class="nav-btn" data-country="japan" id="btnJapan">🇯🇵 Japan</button>
    </nav>

    <main id="content">
        <!-- Content will be injected here by main.js -->
    </main>

    <footer>
        <p id="footerText">&copy; 2026 East Asian Culture Guide. All rights reserved.</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
